<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login - RouteOptima</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="module">
    // Import Firebase SDK (Modular)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAbto42lZDAnK-gqnKwPZAX-RPPYBKFc1U",
      authDomain: "routeoptima-c4f54.firebaseapp.com",
      projectId: "routeoptima-c4f54",
      storageBucket: "routeoptima-c4f54.appspot.com",
      messagingSenderId: "73547332740",
      appId: "1:73547332740:web:61c1890bc529d9eda4d6d1"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Google Sign-In function
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("googleSignIn").addEventListener("click", async () => {
        try {
          const result = await signInWithPopup(auth, provider);
          const token = await result.user.getIdToken();

          if (!token) {
            throw new Error("Firebase token is undefined.");
          }

          const response = await fetch("https://googlesignin-production.up.railway.app/auth/google", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ token }),
          });

          if (!response.ok) {
            const errorData = await response.json();
            console.error("Server Error:", errorData);
            return;
          }

          const data = await response.json();

          if (!data.token) {
            throw new Error("Server did not return a token.");
          }

          // Store JWT token in localStorage
          localStorage.setItem("jwtToken", data.token);

          // Redirect to the home page
          window.location.href = "https://routeoptima.onrender.com";
        } catch (error) {
          console.error("Error during Google Sign-In:", error);
        }
      });
    });

  </script>
  <style>
    body {
      background: #f8f9fa;
    }

    .container {
      max-width: 400px;
      margin-top: 80px;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .google-btn {
      background-color: #db4437;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .google-btn:hover {
      background-color: #c1351d;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Login</h2>

    <!-- Regular Email/Password Login -->
    <form method="POST">
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <!-- Google Sign-In Button -->
    <button id="googleSignIn" class="google-btn">Sign in with Google</button>

    <p class="mt-3">Don't have an account? <a href="/signup">Sign Up</a></p>
  </div>

</body>

</html>
