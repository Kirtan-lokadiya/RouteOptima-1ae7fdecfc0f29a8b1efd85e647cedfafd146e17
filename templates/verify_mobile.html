<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mobile Verification - RouteOptima</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      max-width: 500px;
      margin-top: 50px;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    h2 {
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Mobile Verification</h2>
    {% if verified %}
      <div class="alert alert-success">Mobile number verified successfully!</div>
      <a href="/" class="btn btn-primary">Go to Home</a>
    {% else %}
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <form method="POST">
        <div class="mb-3">
          <label for="otp" class="form-label">Enter OTP sent to your mobile</label>
          <input type="text" name="otp" id="otp" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Verify Mobile</button>
      </form>
    {% endif %}
  </div>
</body>
</html>
